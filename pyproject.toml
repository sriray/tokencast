[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tokencast"
version = "0.3.1"
description = "Forecast and optimize the cost & time of agentic coding tasks"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "sriray" },
]
keywords = [
    "llm",
    "agents",
    "claude",
    "cost",
    "forecast",
    "finops",
    "tokens",
    "estimation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
    "Environment :: Console",
]
dependencies = []

[project.optional-dependencies]
optimize = ["claude-agent-sdk>=0.1.0", "pyyaml>=6.0"]
dev = ["pytest>=7.0", "pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/sriray/tokencast"
Repository = "https://github.com/sriray/tokencast"
Issues = "https://github.com/sriray/tokencast/issues"

[project.scripts]
tokencast = "tokencast:main"
tokencast-optimize = "optimize.cli:main"

[tool.setuptools]
py-modules = ["tokencast", "budget"]

[tool.setuptools.packages.find]
include = ["optimize", "optimize.*"]

[tool.setuptools.package-data]
optimize = ["**/*.md", "**/*.yaml", "**/*.yml", "**/*.json"]

# NOTE: tokencast.html (the standalone no-build browser version) and docs/ are
# not importable Python and are not auto-included in the sdist by setuptools.
# To ship them in the sdist, add a MANIFEST.in with e.g.:
#   include tokencast.html README.md LICENSE CHANGELOG.md ROADMAP.md
#   recursive-include docs *
# (MANIFEST.in is intentionally left to the repo maintainer to create.)
