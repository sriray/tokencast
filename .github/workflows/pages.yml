name: Deploy tokencast.html to GitHub Pages

# Publishes the single-file browser tool (tokencast.html) to GitHub Pages.
# tokencast.html parses logs entirely client-side — nothing is uploaded — so the
# static deploy is the whole app. We stage it as index.html (so the bare Pages URL
# serves the tool) and also keep it reachable at /tokencast.html.
#
# One-time setup: in the repo, Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". After that this runs automatically on every push to
# main that touches the HTML (or via the manual "Run workflow" button).

on:
  push:
    branches: [main]
    paths:
      - "tokencast.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Stage the site
        run: |
          mkdir -p _site
          cp tokencast.html _site/index.html
          cp tokencast.html _site/tokencast.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
